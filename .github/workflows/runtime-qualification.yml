name: Runtime qualification

on:
  pull_request:
    paths:
      - 'resilient-runtime/**'
      - '.github/workflows/runtime-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: host runtime (test threads ${{ matrix.threads }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        threads: [1, 8]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: resilient-runtime
          key: runtime-qualification
      - name: Run and record runtime tests
        env:
          THREADS: ${{ matrix.threads }}
          EVIDENCE_ROOT: ${{ runner.temp }}/runtime-evidence
        run: |
          python3 agent-scripts/e2e-evidence.py run --output "$EVIDENCE_ROOT" \
            --input resilient-runtime/src/gpio.rs \
            --input resilient-runtime/src/sink.rs \
            --input resilient-runtime/src/live_telemetry.rs \
            --input resilient-runtime/tests/global_hook_serialization.rs \
            --input resilient-runtime/tests/global_hook_contention.rs -- \
            cargo test --manifest-path resilient-runtime/Cargo.toml --locked --features vm -- --test-threads="$THREADS"
      - name: Bounded diagnostics for existing concurrency anomalies
        if: always() && matrix.threads == 8
        env:
          DIAGNOSTIC_ROOT: ${{ runner.temp }}/runtime-diagnostics
        run: |
          mkdir -p "$DIAGNOSTIC_ROOT"
          failures=0
          for iteration in $(seq 1 12); do
            for scope in gpio hooks; do
              bundle="$DIAGNOSTIC_ROOT/$scope-$iteration"
              if [ "$scope" = gpio ]; then
                args=(--lib gpio::tests:: -- --test-threads=8)
              else
                args=(--test global_hook_serialization -- --test-threads=1)
              fi
              if python3 agent-scripts/e2e-evidence.py run --output "$bundle" \
                --input resilient-runtime/src/gpio.rs \
                --input resilient-runtime/src/sink.rs \
                --input resilient-runtime/src/live_telemetry.rs \
                --input resilient-runtime/tests/global_hook_serialization.rs -- \
                cargo test --manifest-path resilient-runtime/Cargo.toml --locked --features vm "${args[@]}"; then
                printf '%s %s passed\n' "$scope" "$iteration" >> "$DIAGNOSTIC_ROOT/outcomes.txt"
              else
                printf '%s %s failed\n' "$scope" "$iteration" >> "$DIAGNOSTIC_ROOT/outcomes.txt"
                failures=$((failures + 1))
              fi
              python3 agent-scripts/e2e-evidence.py verify "$bundle"
            done
          done
          # This is a characterization experiment, not a clean-runtime acceptance gate.
          printf 'Observed %s failed invocations among 24 bounded diagnostic runs.\n' "$failures" | tee -a "$GITHUB_STEP_SUMMARY"
          cat "$DIAGNOSTIC_ROOT/outcomes.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain bounded diagnostic evidence
        if: always() && matrix.threads == 8
        uses: actions/upload-artifact@v4
        with:
          name: runtime-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-diagnostics
          retention-days: 90
          if-no-files-found: error
      - name: Verify evidence after success or failure
        if: always()
        run: python3 agent-scripts/e2e-evidence.py verify "${{ runner.temp }}/runtime-evidence"
      - name: Retain runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.threads }}-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-evidence
          retention-days: 90
          if-no-files-found: error
