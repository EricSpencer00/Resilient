name: integration-follow-main

# Keep the `agents/integration` branch at-or-ahead of `main` and keep
# open non-draft PR branches fresh so auto-merge does not stall on stale
# bases.
#
# If agents/integration has diverged after squash merges, reconcile it only
# when every integration-only commit is already represented by an equivalent
# patch on main. Unique in-flight work is left untouched for human review.

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  fast-forward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test integration ref reconciliation
        run: bash agent-scripts/test-reconcile-integration.sh

      - name: Reconcile agents/integration with main
        run: |
          set -euo pipefail
          git fetch origin main
          # agents/integration may not exist yet — tolerate failure.
          git fetch origin agents/integration 2>/dev/null || true
          bash agent-scripts/reconcile-integration.sh

      - name: Refresh open PR branches against main
        env:
          COMMENT_ON_FAILURE: ${{ github.event_name == 'schedule' && '0' || '1' }}
        run: agent-scripts/refresh-open-prs.sh
