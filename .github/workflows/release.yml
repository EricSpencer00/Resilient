name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Exact source commit to build (empty uses the selected workflow ref)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.source_ref || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: package ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
    env:
      REQUESTED_SOURCE_REF: ${{ inputs.source_ref }}
      CARGO_BUILD_JOBS: 2
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: resilient
          key: release-static-${{ matrix.target }}
      - name: Resolve release identity
        run: |
          if [[ -n "$REQUESTED_SOURCE_REF" ]]; then [[ "$REQUESTED_SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; fi
          host=$(rustc -vV | sed -n 's/^host: //p')
          test "$host" = '${{ matrix.target }}'
          VERSION=$(sed -nE 's/^version = "([^"]+)"/\1/p' resilient/Cargo.toml | head -1)
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "v$VERSION"; fi
          test -z "$(git status --porcelain)"
      - name: Install Linux static solver build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake python3 pkg-config libclang-dev
      - name: Install macOS static solver build tools
        if: runner.os == 'macOS'
        run: |
          brew install gcc@13
          stage="$(mktemp -d)"
          cp "$(gcc-13 -print-file-name=libstdc++.a)" "$stage/"
          cp "$(gcc-13 -print-file-name=libemutls_w.a)" "$stage/"
          echo "Z3_MACOS_STATIC_CXX_LIBDIR=$stage" >> "$GITHUB_ENV"
      - name: Build Linux release with LSP and static Z3
        if: runner.os == 'Linux'
        run: cargo build --release --locked --target ${{ matrix.target }} --features lsp,z3,z3-static
        working-directory: resilient
      - name: Build macOS release with LSP and static Z3
        if: runner.os == 'macOS'
        run: |
          CC=gcc-13 CXX=g++-13 CXXSTDLIB=stdc++ \
            RUSTFLAGS="-L ${Z3_MACOS_STATIC_CXX_LIBDIR} -l emutls_w" \
            cargo build --release --locked --target ${{ matrix.target }} --features lsp,z3,z3-static
        working-directory: resilient
      - name: Strip and record runtime dependencies
        run: |
          binary="resilient/target/${{ matrix.target }}/release/rz"
          strip "$binary"
          mkdir -p dist
          if [[ "$RUNNER_OS" == macOS ]]; then
            codesign --force --sign - "$binary"
            otool -L "$binary" | tee "dist/runtime-${{ matrix.target }}.txt"
            ! grep -E 'libz3|/opt/homebrew|/usr/local/(opt|Cellar)' "dist/runtime-${{ matrix.target }}.txt"
          else
            ldd "$binary" | tee "dist/runtime-${{ matrix.target }}.txt"
            ! grep -E 'libz3|not found' "dist/runtime-${{ matrix.target }}.txt"
          fi
      - name: Package and smoke the extracted archive
        run: python3 scripts/package-release.py '${{ matrix.target }}' "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binary-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
  assemble:
    name: assemble release assets
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - name: Verify complete platform inventory
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path('dist')
          records=[json.loads(p.read_text()) for p in root.glob('rz-*.json')]
          targets={'x86_64-unknown-linux-gnu','aarch64-unknown-linux-gnu','x86_64-apple-darwin','aarch64-apple-darwin'}
          assert len(records)==4 and {r['target'] for r in records}==targets
          source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert {r['source_commit'] for r in records}=={source}
          assert len({r['version'] for r in records})==1
          for record in records:
              assert record['archive_sha256']==hashlib.sha256((root/record['archive']).read_bytes()).hexdigest()
          (root/'release-manifest.json').write_text(json.dumps({'source_commit':source,'platforms':records},sort_keys=True,indent=2)+'\n')
          (root/'SHA256SUMS').write_text(''.join((root/(r['archive']+'.sha256')).read_text() for r in sorted(records,key=lambda r:r['target'])))
          PY
          cp scripts/install.sh LICENSE dist/
          (cd dist && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/
          retention-days: 90
  install:
    name: clean install ${{ matrix.os }}
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Install the assembled release without source-build tools
        run: |
          set +e
          python3 agent-scripts/e2e-evidence.py run --output "${{ runner.temp }}/release-install-evidence" --input scripts/install.sh --input scripts/release-install-smoke.py --input dist/release-manifest.json -- python3 scripts/release-install-smoke.py dist
          result=$?
          set -e
          python3 agent-scripts/e2e-evidence.py verify "${{ runner.temp }}/release-install-evidence"
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clean-install-${{ matrix.os }}
          path: ${{ runner.temp }}/release-install-evidence
          retention-days: 90
  publish_tag:
    name: publish validated tag assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [assemble, install]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          source=subprocess.check_output(['git','rev-parse',os.environ['GITHUB_REF']+'^{commit}'],text=True).strip()
          manifest=json.loads(pathlib.Path('dist/release-manifest.json').read_text())
          assert manifest['source_commit']==source
          runs=json.loads(subprocess.check_output(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs?head_sha={source}&event=push&per_page=100"],text=True))['workflow_runs']
          main_runs=[run for run in runs if run['head_branch']=='main' and run['head_sha']==source]
          latest={}
          for run in sorted(main_runs,key=lambda r:(r['run_number'],r['run_attempt']),reverse=True): latest.setdefault(run['workflow_id'],run)
          main=list(latest.values())
          assert any(run['path']=='.github/workflows/ci.yml' and run['conclusion']=='success' for run in main), 'exact-source main CI has not passed'
          assert all(run['status']=='completed' and run['conclusion'] in ('success','skipped','neutral') for run in main), 'exact-source main gates are incomplete or failed'
          PY
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Resilient $GITHUB_REF_NAME" --generate-notes dist/*
