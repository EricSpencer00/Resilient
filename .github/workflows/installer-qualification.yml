name: Installer qualification
on:
  pull_request:
    paths:
      - 'scripts/install.sh'
      - '.github/tests/installer_contract.py'
      - '.github/workflows/installer-qualification.yml'
      - '.github/workflows/release.yml'
      - 'docs/_layouts/landing.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Installer contract through the public script
        run: |
          set +e
          python3 agent-scripts/e2e-evidence.py run --output "${{ runner.temp }}/installer-evidence" --input .github/tests/installer_contract.py --input scripts/install.sh -- python3 .github/tests/installer_contract.py
          result=$?
          set -e
          python3 agent-scripts/e2e-evidence.py verify "${{ runner.temp }}/installer-evidence"
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/installer-evidence
