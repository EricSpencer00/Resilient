name: Machine arithmetic qualification

on:
  pull_request:
    paths:
      - 'resilient/src/contract_verify.rs'
      - 'resilient/src/verifier_z3.rs'
      - 'resilient/src/machine_arithmetic.rs'
      - 'resilient/tests/machine_arithmetic_binding.rs'
      - '.github/workflows/machine-arithmetic-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: machine-arithmetic-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    name: machine arithmetic (${{ matrix.phase }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        phase: [baseline, final]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.phase == 'baseline' && '9f1d870acc5d5ba963a7e27d522e60aa70f7213e' || github.sha }}
          fetch-depth: 0
      - name: Install the same regression input on the production baseline
        if: matrix.phase == 'baseline'
        env:
          CANDIDATE: ${{ github.sha }}
        run: |
          git fetch --no-tags origin "$CANDIDATE"
          git show "$CANDIDATE:resilient/tests/machine_arithmetic_binding.rs" > resilient/tests/machine_arithmetic_binding.rs
          git show "$CANDIDATE:resilient/tests/machine_arithmetic_boundaries.rs" > resilient/tests/machine_arithmetic_boundaries.rs
          git show "$CANDIDATE:resilient/tests/machine_arithmetic_const_boundary.rs" > resilient/tests/machine_arithmetic_const_boundary.rs
          git show "$CANDIDATE:resilient/tests/machine_arithmetic_signed_replay.rs" > resilient/tests/machine_arithmetic_signed_replay.rs
          git show "$CANDIDATE:resilient/tests/machine_arithmetic_free_names.rs" > resilient/tests/machine_arithmetic_free_names.rs
          git show "$CANDIDATE:resilient/tests/machine_arithmetic_export_boundary.rs" > resilient/tests/machine_arithmetic_export_boundary.rs
          git show "$CANDIDATE:resilient/tests/machine_arithmetic_runtime_guards.rs" > resilient/tests/machine_arithmetic_runtime_guards.rs
          git show "$CANDIDATE:resilient/tests/machine_arithmetic_rejected_report.rs" > resilient/tests/machine_arithmetic_rejected_report.rs
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - name: Install solver dependencies
        run: sudo apt-get update && sudo apt-get install -y libz3-dev z3 clang
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: resilient
          key: machine-arithmetic-qualification
      - name: Record solver identity
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/machine-arithmetic-qualification
        run: |
          mkdir -p "$EVIDENCE_ROOT"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess
          binary = pathlib.Path(shutil.which('z3'))
          record = {'z3_version': subprocess.check_output([str(binary), '-version'], text=True).strip(),
                    'z3_sha256': hashlib.sha256(binary.read_bytes()).hexdigest(),
                    'libz3_sha256': {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted({p.resolve() for p in pathlib.Path('/usr/lib/x86_64-linux-gnu').glob('libz3.so*')})}}
          (pathlib.Path(os.environ['EVIDENCE_ROOT']) / 'solver.json').write_text(json.dumps(record, sort_keys=True, indent=2) + '\n')
          PY
      - name: Build the regression executables once
        env:
          BINDGEN_EXTRA_CLANG_ARGS: -I/usr/include
          LIBRARY_PATH: /usr/lib/x86_64-linux-gnu
        run: cargo test --manifest-path resilient/Cargo.toml --locked --features z3 --no-run --test machine_arithmetic_binding --test machine_arithmetic_boundaries --test machine_arithmetic_const_boundary --test machine_arithmetic_signed_replay --test machine_arithmetic_free_names --test machine_arithmetic_export_boundary --test machine_arithmetic_runtime_guards --test machine_arithmetic_rejected_report
      - name: Record each regression and its control
        env:
          PHASE: ${{ matrix.phase }}
          EVIDENCE_ROOT: ${{ runner.temp }}/machine-arithmetic-qualification
          BINDGEN_EXTRA_CLANG_ARGS: -I/usr/include
          LIBRARY_PATH: /usr/lib/x86_64-linux-gnu
          MACHINE_ARITHMETIC_RECORDS: ${{ runner.temp }}/machine-arithmetic-qualification/raw
        run: |
          unexpected=0
          for suite in machine_arithmetic_binding machine_arithmetic_boundaries machine_arithmetic_const_boundary machine_arithmetic_signed_replay machine_arithmetic_free_names machine_arithmetic_export_boundary machine_arithmetic_runtime_guards machine_arithmetic_rejected_report; do
            for test in $(sed -n 's/^fn \([a-z0-9_]*\)().*/\1/p' "resilient/tests/$suite.rs"); do
              set +e
              python3 agent-scripts/e2e-evidence.py run --output "$EVIDENCE_ROOT/$test" \
                --input "resilient/tests/$suite.rs" -- \
                cargo test --manifest-path resilient/Cargo.toml --locked --features z3 \
                  --test "$suite" "$test" -- --exact --nocapture
              result=$?
              set -e
              python3 agent-scripts/e2e-evidence.py verify "$EVIDENCE_ROOT/$test"
              expected=passed
              if [[ "$PHASE" == baseline && "$test" != declared_contract_behavior_remains_available && "$test" != conversion_is_outside_the_machine_profile && "$test" != bytecode_vm_default_wrap_matches_boundary_checkpoints && "$test" != vm_runtime_requires_control ]]; then
                expected=failed
              fi
              printf '%s %s %s expected-%s\n' "$suite" "$test" "$result" "$expected" >> "$EVIDENCE_ROOT/outcomes.txt"
              if [[ "$expected" == failed && "$result" -eq 0 ]] || [[ "$expected" == passed && "$result" -ne 0 ]]; then
                unexpected=$((unexpected + 1))
              fi
            done
          done
          cat "$EVIDENCE_ROOT/outcomes.txt" >> "$GITHUB_STEP_SUMMARY"
          test "$unexpected" -eq 0
      - name: Replay and sign actual machine queries
        if: matrix.phase == 'final'
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/machine-arithmetic-qualification
        run: python3 qualification/machine-arithmetic/capture_queries.py resilient/target/debug/rz "$EVIDENCE_ROOT/raw" "$EVIDENCE_ROOT/signed-queries"
      - name: Retain source-bound records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machine-arithmetic-${{ matrix.phase }}-${{ github.sha }}
          path: ${{ runner.temp }}/machine-arithmetic-qualification
          retention-days: 90
          if-no-files-found: error

  attest:
    name: verify replay red-green evidence
    needs: evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: machine-arithmetic-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/baseline
      - uses: actions/download-artifact@v4
        with:
          name: machine-arithmetic-final-${{ github.sha }}
          path: ${{ runner.temp }}/final
      - name: Verify paired evidence
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}
        run: |
          cmp "$EVIDENCE_ROOT/baseline/solver.json" "$EVIDENCE_ROOT/final/solver.json"
          for suite in machine_arithmetic_binding machine_arithmetic_boundaries machine_arithmetic_const_boundary machine_arithmetic_signed_replay machine_arithmetic_free_names machine_arithmetic_export_boundary machine_arithmetic_runtime_guards machine_arithmetic_rejected_report; do
            for test in $(sed -n 's/^fn \([a-z0-9_]*\)().*/\1/p' "resilient/tests/$suite.rs"); do
              if [[ "$test" == declared_contract_behavior_remains_available || "$test" == conversion_is_outside_the_machine_profile || "$test" == bytecode_vm_default_wrap_matches_boundary_checkpoints || "$test" == vm_runtime_requires_control ]]; then continue; fi
              python3 agent-scripts/e2e-evidence.py attest --test "$test" \
                --baseline "$EVIDENCE_ROOT/baseline/$test" --final "$EVIDENCE_ROOT/final/$test" \
                --output "$EVIDENCE_ROOT/attestations/$test"
              python3 agent-scripts/e2e-evidence.py verify-attestation "$EVIDENCE_ROOT/attestations/$test" \
                --baseline "$EVIDENCE_ROOT/baseline/$test" --final "$EVIDENCE_ROOT/final/$test"
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: machine-arithmetic-attestations-${{ github.sha }}
          path: ${{ runner.temp }}/attestations
          retention-days: 90
          if-no-files-found: error
