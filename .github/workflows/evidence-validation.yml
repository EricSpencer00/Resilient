name: Evidence validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'agent-scripts/e2e-*'
      - 'agent-scripts/test-e2e-*'
      - 'scripts/check_qualification.py'
      - 'scripts/test_check_qualification.py'
      - 'qualification/**'
      - '.github/workflows/evidence-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    name: evidence tooling and retained records
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exercise evidence collection and attestation
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/resilient-evidence-validation
        run: |
          python3 agent-scripts/e2e-evidence.py run --output "$EVIDENCE_ROOT/collector" \
            --input agent-scripts/e2e-evidence.py \
            --input agent-scripts/test-e2e-evidence.sh -- \
            bash agent-scripts/test-e2e-evidence.sh
          python3 agent-scripts/e2e-evidence.py verify "$EVIDENCE_ROOT/collector"
          python3 agent-scripts/e2e-evidence.py run --output "$EVIDENCE_ROOT/attestation" \
            --input agent-scripts/e2e-evidence.py \
            --input agent-scripts/test-e2e-attestation.sh \
            --input agent-scripts/e2e-attestation-probe.py -- \
            bash agent-scripts/test-e2e-attestation.sh
          python3 agent-scripts/e2e-evidence.py verify "$EVIDENCE_ROOT/attestation"
      - name: Check qualification intake and retained bundles
        run: |
          python3 -m unittest discover -s scripts -p test_check_qualification.py -v
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          for manifest in sorted(Path('qualification').rglob('manifest.json')):
              subprocess.run(['python3', 'agent-scripts/e2e-evidence.py', 'verify', str(manifest.parent)], check=True)
          PY
      - name: Verify permanent hosted records
        run: |
          root=qualification/hosted-records/2026-10-contract-runtime
          (cd "$root" && sha256sum -c SHA256SUMS)
          cmp "$root/contract/baseline/solver.json" "$root/contract/final/solver.json"
          for test in straight_return_replays branch_returns_replay_separately constant_return_replays; do
            python3 agent-scripts/e2e-evidence.py verify-attestation "$root/contract/attestations/$test" \
              --baseline "$root/contract/baseline/$test" --final "$root/contract/final/$test"
          done
          python3 - <<'PYCODE'
          import json, os, pathlib, subprocess, tempfile
          root = pathlib.Path('qualification/hosted-records/2026-10-contract-runtime')
          for source in json.loads((root / 'sources.json').read_text()):
              with tempfile.TemporaryDirectory() as temporary:
                  env = dict(os.environ, GIT_INDEX_FILE=str(pathlib.Path(temporary) / 'index'))
                  subprocess.run(['git', 'read-tree', source['base']], env=env, check=True)
                  subprocess.run(['git', 'apply', '--cached', str(root / source['patch'])], env=env, check=True)
                  tree = subprocess.check_output(['git', 'write-tree'], env=env, text=True).strip()
                  assert tree == source['tree'], (source['label'], tree)
          PYCODE
      - name: Verify retained source-binding regression records
        run: |
          (cd qualification/hosted-records/2026-10-source-binding && sha256sum -c SHA256SUMS)
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib, subprocess, tempfile
          archive = pathlib.Path('qualification/hosted-records/2026-10-source-binding')
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'retained-source-binding'
          assert not root.exists(), 'record materialization requires a fresh directory'
          root.mkdir()
          records = json.loads((archive / 'records.json').read_text())
          assert records['schema'] == 'resilient-retained-record-files' and records['schema_version'] == 1
          assert len(records['files']) == 265
          seen = set()
          for record in records['files']:
              relative = pathlib.PurePosixPath(record['path'])
              assert not relative.is_absolute() and '..' not in relative.parts
              assert str(relative) == record['path'] and '\\' not in record['path']
              assert relative.parts[0] in ('baseline', 'final', 'attestations')
              path = root.joinpath(*relative.parts)
              assert path.resolve().is_relative_to(root.resolve())
              assert path not in seen, record['path']
              seen.add(path)
              raw = record['text'].encode('utf-8')
              assert hashlib.sha256(raw).hexdigest() == record['sha256'], record['path']
              path.parent.mkdir(parents=True, exist_ok=True)
              with path.open('xb') as output:
                  output.write(raw)
          manifests = sorted(root.rglob('manifest.json'))
          assert len(manifests) == 48
          for manifest in manifests:
              subprocess.run(['python3', 'agent-scripts/e2e-evidence.py', 'verify', str(manifest.parent)], check=True)
          assert (root / 'baseline/solver.json').read_bytes() == (root / 'final/solver.json').read_bytes()
          attestations = sorted((root / 'attestations').glob('*/attestation.json'))
          assert len(attestations) == 23
          for attestation in attestations:
              test = attestation.parent.name
              subprocess.run(['python3', 'agent-scripts/e2e-evidence.py', 'verify-attestation', str(attestation.parent),
                              '--baseline', str(root / 'baseline' / test), '--final', str(root / 'final' / test)], check=True)
          sources = json.loads((archive / 'sources.json').read_text())
          for source in sources:
              patch = archive / source['patch']
              assert hashlib.sha256(patch.read_bytes()).hexdigest() == source['patch_sha256']
              with tempfile.TemporaryDirectory() as temporary:
                  env = dict(os.environ, GIT_INDEX_FILE=str(pathlib.Path(temporary) / 'index'))
                  subprocess.run(['git', 'read-tree', source['base']], env=env, check=True)
                  subprocess.run(['git', 'apply', '--cached', str(patch)], env=env, check=True)
                  tree = subprocess.check_output(['git', 'write-tree'], env=env, text=True).strip()
                  assert tree == source['tree'], (source['label'], tree)
          for phase, source in zip(('baseline', 'final'), sources):
              manifests = sorted((root / phase).glob('*/manifest.json'))
              assert len(manifests) == 24
              input_hashes = {}
              for path in manifests:
                  manifest = json.loads(path.read_text())
                  control = path.parent.name == 'legacy_replay_remains_compatible_without_binding'
                  expected = 'passed' if phase == 'final' or control else 'failed'
                  assert manifest['result']['status'] == expected
                  assert manifest['source']['commit'] == source.get('tested_revision', source['base'])
                  assert manifest['source']['dirty'] == (phase == 'baseline')
                  assert manifest['source']['worktree_sha256'] == source.get('worktree_sha256')
                  for declared in manifest['inputs']:
                      blob = subprocess.check_output(['git', 'show', source['tree'] + ':' + declared['path']])
                      assert hashlib.sha256(blob).hexdigest() == declared['sha256']
                      input_hashes[declared['path']] = declared['sha256']
              if phase == 'baseline':
                  state = {'tracked_diff_sha256': hashlib.sha256(b'').hexdigest(),
                           'untracked': [{'path': path, 'sha256': digest} for path, digest in sorted(input_hashes.items())]}
                  fingerprint = hashlib.sha256((json.dumps(state, sort_keys=True, indent=2) + '\n').encode()).hexdigest()
                  assert fingerprint == source['worktree_sha256']
          PYCODE
      - name: Validate the populated host preparation dossier
        run: |
          (cd qualification/host-cli-2026-10 && sha256sum -c SHA256SUMS)
          python3 - <<'PYTHON'
          import json, re, subprocess
          result = subprocess.run(
              ['python3', 'scripts/check_qualification.py',
               'qualification/host-cli-2026-10/package.json'],
              text=True, capture_output=True)
          print(result.stdout)
          report = json.loads(result.stdout)
          assert result.returncode == 1 and report['status'] == 'gaps'
          assert report['certified'] is False
          allowed = (': evidence not reviewed', ': missing reviewer', ': missing review_record',
                     ': evidence_control must reference reviewed evidence')
          unexpected = [gap for gap in report['gaps'] if not (
              gap.endswith(allowed) or re.fullmatch(
                  r'open_issues: [0-9]+ unresolved; resolve before intake completion', gap))]
          assert not unexpected, unexpected
          PYTHON
      - name: Verify any produced bundles after failure
        if: always()
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/resilient-evidence-validation
        run: |
          for bundle in "$EVIDENCE_ROOT"/*; do
            if [ -d "$bundle" ]; then
              python3 agent-scripts/e2e-evidence.py verify "$bundle"
            fi
          done
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-validation-${{ github.sha }}
          path: ${{ runner.temp }}/resilient-evidence-validation
          if-no-files-found: warn
          retention-days: 90
